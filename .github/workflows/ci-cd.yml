name: CI/CD

on:
  push:
    branches-ignore: [ci-resultado]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Testes da documentação: arquivos, links, âncoras, imagens,
  # dicionário x script, regras citadas e ausência de dados pessoais.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testes da documentação
        run: npm test 2>&1 | tee test.log
      - name: Guardar o log dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-test
          path: test.log

  # Roda o script.sql e a massa-dados.sql num MySQL 8.0 limpo.
  banco:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot -proot --default-character-set=utf8mb4
    steps:
      - uses: actions/checkout@v5

      - name: Versão do MySQL
        run: $MYSQL -N -e "SELECT VERSION();" 2>&1 | sed "/password on the command line/d" | tee banco.log

      - name: script.sql — seções 1 a 7 (estrutura, massa, JOIN, UPDATE/DELETE, consultas G e A)
        run: |
          echo "== docs/script.sql" >> banco.log
          $MYSQL --table < docs/script.sql 2>&1 | sed "/password on the command line/d" | tee resultado-consultas.txt
          head -60 resultado-consultas.txt >> banco.log

      - name: Conferir os registros depois do script (seção 6 apaga 2 linhas e o trigger grava 2 logs)
        run: |
          echo "== conferência depois do script.sql" >> banco.log
          falhou=0
          while read -r tabela esperado; do
            real=$($MYSQL -N -e "SELECT COUNT(*) FROM ong_nossa_senhora_fatima.$tabela" 2>/dev/null)
            echo "$tabela: $real (esperado $esperado)" | tee -a banco.log
            [ "$real" = "$esperado" ] || falhou=1
          done <<'LISTA'
          beneficiario 250
          encaminhamento_atendimento 232
          referencia_familiar 260
          log_acesso 211
          LISTA
          exit $falhou

      - name: Conferir que o trigger gravou o log das alterações
        run: |
          logs=$($MYSQL -N -e "SELECT COUNT(*) FROM ong_nossa_senhora_fatima.log_acesso WHERE tabela_afetada = 'beneficiario' AND id_registro IN (3, 41) AND operacao IN ('ALTERACAO', 'ANONIMIZACAO') AND data_hora >= CURDATE()" 2>/dev/null)
          echo "linhas de log criadas pelo trigger: $logs" | tee -a banco.log
          [ "$logs" = "2" ]

      - name: Conferir que nenhum produto tem saldo negativo
        run: |
          negativos=$($MYSQL -N -e "SELECT COUNT(*) FROM ong_nossa_senhora_fatima.v_estoque_produto WHERE saldo < 0" 2>/dev/null)
          echo "produtos com saldo negativo: $negativos" | tee -a banco.log
          [ "$negativos" = "0" ]

      - name: massa-dados.sql — recarregar a massa e conferir a quantidade por tabela
        run: |
          echo "== docs/massa-dados.sql" >> banco.log
          $MYSQL --table < docs/massa-dados.sql 2>&1 | sed "/password on the command line/d" | tee -a banco.log
          falhou=0
          while read -r tabela esperado; do
            real=$($MYSQL -N -e "SELECT COUNT(*) FROM ong_nossa_senhora_fatima.$tabela" 2>/dev/null)
            echo "$tabela: $real (esperado $esperado)" | tee -a banco.log
            [ "$real" = "$esperado" ] || falhou=1
          done <<'LISTA'
          profissional_responsavel 4
          orgao_parceiro 16
          beneficiario 250
          trabalho 242
          composicao_familiar 509
          referencia_familiar 261
          atendimento 727
          encaminhamento_atendimento 233
          pia 42
          produto 13
          recebimento_doacao 19
          item_recebimento 51
          entrega_cesta 237
          saida_estoque 106
          voluntario 8
          evento 8
          participacao_evento 356
          voluntario_evento 21
          log_acesso 209
          LISTA
          exit $falhou

      - name: Guardar o log e o resultado das consultas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-banco
          path: |
            banco.log
            resultado-consultas.txt

  # Grava o resumo da última execução na branch "ci-resultado",
  # para conferir o resultado sem abrir a aba Actions.
  resultado:
    needs: [test, banco]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: logs
          merge-multiple: true

      - name: Publicar o resumo na branch ci-resultado
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir saida && cd saida
          {
            echo "# Resultado da última execução do CI"
            echo
            echo "| Item | Valor |"
            echo "| :--- | :--- |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Execução | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| Job test (documentação) | **${{ needs.test.result }}** |"
            echo "| Job banco (MySQL 8.0) | **${{ needs.banco.result }}** |"
          } > RESULTADO.md
          cp ../logs/* . 2>/dev/null || true
          git init -q -b ci-resultado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resultado do CI para ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-resultado
